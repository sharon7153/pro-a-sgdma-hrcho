<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380">
<style>
  svg text { font-family: "Malgun Gothic", sans-serif; fill: #1f2a37; }
  svg .m { font-family: Consolas, monospace; }
  svg .tt { font-weight: 700; }
  svg .s { font-size: 10px; } svg .xs { font-size: 9px; } svg .md { font-size: 11px; } svg .lg { font-size: 12.5px; }
  svg .mu { fill: #5b6573; }
  svg .sgc { fill: #2f5fa7; } svg .dpc { fill: #b85a22; } svg .red { fill: #b42318; }
  svg .ln { stroke: #3f4a56; stroke-width: 1.3; fill: none; }
  svg .lnd { stroke: #8a94a3; stroke-width: 1.1; fill: none; stroke-dasharray: 4 3; }
  svg .lns { stroke: #2f5fa7; stroke-width: 1.5; fill: none; }
  svg .lno { stroke: #b85a22; stroke-width: 1.5; fill: none; }
  svg .lnr { stroke: #b42318; stroke-width: 1.5; fill: none; }
  svg .bct { fill: #f3f4f6; stroke: #5f6b7a; stroke-width: 1.2; }
  svg .bsg { fill: #e7eefa; stroke: #2f5fa7; stroke-width: 1.4; }
  svg .bdp { fill: #fcf0e6; stroke: #b85a22; stroke-width: 1.4; }
  svg .bw  { fill: #ffffff; stroke: #5f6b7a; stroke-width: 1.2; }
  svg .bext { fill: #ffffff; stroke: #9aa3ae; stroke-width: 1.1; stroke-dasharray: 5 3; }
  svg .grp { fill: none; stroke: #9aa3ae; stroke-width: 1.1; stroke-dasharray: 6 4; }
  svg .grpsg { fill: #f6f9fe; stroke: #2f5fa7; stroke-width: 1.1; stroke-dasharray: 6 4; }
  svg .grpdp { fill: #fffaf5; stroke: #b85a22; stroke-width: 1.1; stroke-dasharray: 6 4; }
  svg .top { fill: #fbfbfc; stroke: #1f2a37; stroke-width: 1.8; }
  svg .num { fill: #1f2a37; } svg .numt { fill: #fff; font-size: 10px; font-weight: 700; }
svg { background: #ffffff; }
</style>
<defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#3f4a56"/></marker>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#2f5fa7"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#b85a22"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#b42318"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#8a94a3"/></marker>
  </defs>
  <!-- outer -->
  <rect class="top" x="105" y="22" width="470" height="340" rx="5"/>
  <text x="115" y="356" class="s tt">sg_dma_top</text>
  <!-- ports left -->
  <text x="8" y="72" class="s m">s_axi</text><text x="8" y="84" class="xs mu">(AXI4-Lite)</text>
  <path class="ln" d="M 60 70 L 128 70" marker-end="url(#a)" marker-start="url(#a)"/>
  <text x="8" y="198" class="s m">m_sg_axi</text><text x="8" y="210" class="xs mu">(AR, R)</text>
  <path class="lns" d="M 66 196 L 128 196" marker-end="url(#as)" marker-start="url(#as)"/>
  <text x="8" y="296" class="s m">m_src_axi</text><text x="8" y="308" class="xs mu">(AR, R)</text>
  <path class="lno" d="M 66 294 L 150 294" marker-end="url(#ao)" marker-start="url(#ao)"/>
  <text x="8" y="342" class="s m">clk, resetn</text>
  <path class="ln" d="M 70 338 L 105 338" marker-end="url(#a)"/>
  <!-- ports right -->
  <text x="620" y="40" class="s m">irq</text>
  <path class="ln" d="M 320 50 L 320 36 L 614 36" marker-end="url(#a)"/>
  <text x="604" y="296" class="s m">m_dest_axi</text><text x="604" y="308" class="xs mu">(AW, W, B)</text>
  <path class="lno" d="M 530 294 L 600 294" marker-end="url(#ao)" marker-start="url(#ao)"/>
  <!-- control plane -->
  <rect class="bct" x="128" y="50" width="100" height="48" rx="3"/>
  <text x="140" y="70" class="md tt m">up_axi</text><text x="140" y="86" class="xs mu">AXI4-Lite slave</text>
  <rect class="bct" x="250" y="50" width="140" height="48" rx="3"/>
  <text x="260" y="70" class="md tt m">axi_dmac_regmap</text><text x="260" y="86" class="xs mu">CONTROL · IRQ · DBG</text>
  <rect class="bct" x="412" y="50" width="150" height="48" rx="3"/>
  <text x="420" y="70" class="s tt m">axi_dmac_regmap_request</text><text x="420" y="86" class="xs mu">SUBMIT · SG_ADDRESS · DONE</text>
  <path class="ln" d="M 228 74 L 248 74" marker-end="url(#a)"/>
  <path class="ln" d="M 390 74 L 410 74" marker-end="url(#a)"/>
  <!-- transfer group -->
  <rect class="grp" x="120" y="118" width="448" height="222" rx="4"/>
  <text x="128" y="333" class="xs mu m">i_transfer (axi_dmac_transfer)</text>
  <rect class="bct" x="128" y="128" width="130" height="34" rx="3"/>
  <text x="136" y="142" class="xs tt m">axi_dmac_reset_manager</text><text x="136" y="155" class="xs mu">ENABLE · PAUSE → enable</text>
  <rect class="bsg" x="128" y="176" width="160" height="44" rx="3"/>
  <text x="138" y="194" class="md tt m">dmac_sg</text><text x="138" y="210" class="xs mu">descriptor fetch FSM</text>
  <!-- MUX trapezoid -->
  <path class="bw" d="M 380 172 L 500 172 L 488 222 L 392 222 z"/>
  <text x="400" y="192" class="s tt">Request MUX</text><text x="398" y="208" class="xs m mu">ctrl_hwdesc ? SG : REG</text>
  <path class="lns" d="M 288 197 L 386 197" marker-end="url(#as)"/>
  <text x="300" y="191" class="xs sgc">descriptor 필드</text>
  <path class="ln" d="M 520 98 L 520 197 L 496 197" marker-end="url(#a)"/>
  <text x="524" y="150" class="xs mu">REG 요청</text><text x="524" y="162" class="xs mu">(HWDESC=0)</text>
  <path class="lns" d="M 440 98 L 440 112 L 210 112 L 210 174" marker-end="url(#as)"/>
  <text x="300" y="108" class="xs sgc">SG_ADDRESS + SUBMIT (HWDESC=1)</text>
  <path class="ln" d="M 440 222 L 440 246" marker-end="url(#a)"/>
  <!-- data engine -->
  <rect class="grpdp" x="150" y="248" width="380" height="76" rx="4"/>
  <text x="160" y="264" class="s tt dpc m">request_arb (data mover)</text>
  <rect class="bdp" x="160" y="276" width="100" height="36" rx="3"/><text x="176" y="298" class="s m">src_axi_mm</text>
  <rect class="bdp" x="290" y="276" width="110" height="36" rx="3"/><text x="300" y="298" class="s m">burst_memory</text>
  <rect class="bdp" x="430" y="276" width="100" height="36" rx="3"/><text x="444" y="298" class="s m">dest_axi_mm</text>
  <path class="lno" d="M 260 294 L 288 294" marker-end="url(#ao)"/>
  <path class="lno" d="M 400 294 L 428 294" marker-end="url(#ao)"/>
  <path class="lnd" d="M 200 248 L 200 220" marker-end="url(#ag)"/>
  <text x="206" y="240" class="xs mu">dma_eot (descriptor마다)</text>
  <path class="lnd" d="M 530 262 L 552 262 L 552 100" marker-end="url(#ag)"/>
  <text x="535" y="276" class="xs mu">완료</text>
</svg>