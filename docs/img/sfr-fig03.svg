<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240">
<style>
  svg text { font-family: "Malgun Gothic", sans-serif; fill: #1f2a37; }
  svg .m { font-family: Consolas, monospace; }
  svg .tt { font-weight: 700; }
  svg .s { font-size: 10px; } svg .xs { font-size: 9px; } svg .md { font-size: 11px; } svg .lg { font-size: 12.5px; }
  svg .mu { fill: #5b6573; }
  svg .sgc { fill: #2f5fa7; } svg .dpc { fill: #b85a22; } svg .red { fill: #b42318; }
  svg .ln { stroke: #3f4a56; stroke-width: 1.3; fill: none; }
  svg .lnd { stroke: #8a94a3; stroke-width: 1.1; fill: none; stroke-dasharray: 4 3; }
  svg .lns { stroke: #2f5fa7; stroke-width: 1.5; fill: none; }
  svg .lno { stroke: #b85a22; stroke-width: 1.5; fill: none; }
  svg .lnr { stroke: #b42318; stroke-width: 1.5; fill: none; }
  svg .bct { fill: #f3f4f6; stroke: #5f6b7a; stroke-width: 1.2; }
  svg .bsg { fill: #e7eefa; stroke: #2f5fa7; stroke-width: 1.4; }
  svg .bdp { fill: #fcf0e6; stroke: #b85a22; stroke-width: 1.4; }
  svg .bw  { fill: #ffffff; stroke: #5f6b7a; stroke-width: 1.2; }
  svg .bext { fill: #ffffff; stroke: #9aa3ae; stroke-width: 1.1; stroke-dasharray: 5 3; }
  svg .grp { fill: none; stroke: #9aa3ae; stroke-width: 1.1; stroke-dasharray: 6 4; }
  svg .grpsg { fill: #f6f9fe; stroke: #2f5fa7; stroke-width: 1.1; stroke-dasharray: 6 4; }
  svg .grpdp { fill: #fffaf5; stroke: #b85a22; stroke-width: 1.1; stroke-dasharray: 6 4; }
  svg .top { fill: #fbfbfc; stroke: #1f2a37; stroke-width: 1.8; }
  svg .num { fill: #1f2a37; } svg .numt { fill: #fff; font-size: 10px; font-weight: 700; }
svg { background: #ffffff; }
</style>
<defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#3f4a56"/></marker>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#2f5fa7"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#b85a22"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#b42318"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#8a94a3"/></marker>
  </defs>
  <!-- inputs -->
  <text x="6" y="44" class="xs m red">dma_eot</text><text x="6" y="56" class="xs mu">(descriptor 완료)</text>
  <text x="6" y="88" class="xs m sgc">resp_out_eot</text><text x="6" y="100" class="xs mu">(ID FIFO의 EOT 플래그)</text>
  <path class="ln" d="M 90 46 L 120 46 L 120 58 L 138 58" marker-end="url(#a)"/>
  <path class="ln" d="M 100 92 L 120 92 L 120 76 L 138 76" marker-end="url(#a)"/>
  <path class="bw" d="M 140 50 L 160 50 A 17 17 0 0 1 160 84 L 140 84 z"/><text x="148" y="72" class="s tt">&amp;</text>
  <text x="128" y="114" class="xs mu">HWDESC=1일 때</text>
  <path class="lnr" d="M 177 67 L 214 67" marker-end="url(#ar)"/><text x="180" y="60" class="xs m red">req_eot</text>
  <rect class="bct" x="216" y="44" width="96" height="46" rx="3"/><text x="224" y="62" class="xs tt m">up_eot</text><text x="224" y="77" class="xs mu">응답 handshake</text>
  <text x="6" y="160" class="xs m">up_sot</text><text x="6" y="172" class="xs mu">(SUBMIT 접수)</text>
  <!-- source register -->
  <rect class="bct" x="340" y="40" width="120" height="150" rx="3"/>
  <text x="350" y="58" class="s tt">IRQ_SOURCE</text><text x="350" y="72" class="xs m">0x088</text>
  <text x="350" y="100" class="xs m">[1] EOT ← set</text><text x="350" y="160" class="xs m">[0] SOT ← set</text>
  <path class="ln" d="M 312 67 L 338 96" marker-end="url(#a)"/>
  <path class="ln" d="M 60 156 L 338 156" marker-end="url(#a)"/>
  <text x="350" y="176" class="xs mu">IRQ_PENDING ← 1</text><text x="350" y="188" class="xs mu">→ 해당 비트 clear</text>
  <!-- mask -->
  <path class="bw" d="M 490 70 L 510 70 A 17 17 0 0 1 510 104 L 490 104 z"/><text x="498" y="92" class="s tt">&amp;</text>
  <path class="ln" d="M 460 115 L 476 115 L 476 96 L 488 96" marker-end="url(#a)"/>
  <text x="472" y="40" class="xs m">~IRQ_MASK</text><text x="472" y="52" class="xs mu">(0x080)</text>
  <path class="ln" d="M 498 56 L 498 68" marker-end="url(#a)"/>
  <path class="ln" d="M 527 87 L 556 87" marker-end="url(#a)"/>
  <text x="520" y="122" class="xs m">IRQ_PENDING</text><text x="520" y="134" class="xs mu">(0x084, 2bit)</text>
  <!-- OR + FF -->
  <path class="bw" d="M 558 70 Q 572 87 558 104 Q 590 104 604 87 Q 590 70 558 70 z"/><text x="568" y="92" class="xs tt">OR</text>
  <rect class="bw" x="616" y="72" width="30" height="30" rx="2"/><text x="621" y="91" class="xs tt">FF</text>
  <path class="ln" d="M 604 87 L 614 87" marker-end="url(#a)"/>
  <path class="lnr" d="M 646 87 L 676 87" marker-end="url(#ar)"/><text x="648" y="80" class="xs m red">irq</text>
</svg>