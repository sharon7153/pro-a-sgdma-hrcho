<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
<style>
  svg text { font-family: "Malgun Gothic", sans-serif; fill: #1f2a37; }
  svg .m { font-family: Consolas, monospace; }
  svg .tt { font-weight: 700; }
  svg .s { font-size: 10px; } svg .xs { font-size: 9px; } svg .md { font-size: 11px; } svg .lg { font-size: 12.5px; }
  svg .mu { fill: #5b6573; }
  svg .sgc { fill: #2f5fa7; } svg .dpc { fill: #b85a22; } svg .red { fill: #b42318; }
  svg .ln { stroke: #3f4a56; stroke-width: 1.3; fill: none; }
  svg .lnd { stroke: #8a94a3; stroke-width: 1.1; fill: none; stroke-dasharray: 4 3; }
  svg .lns { stroke: #2f5fa7; stroke-width: 1.5; fill: none; }
  svg .lno { stroke: #b85a22; stroke-width: 1.5; fill: none; }
  svg .lnr { stroke: #b42318; stroke-width: 1.5; fill: none; }
  svg .bct { fill: #f3f4f6; stroke: #5f6b7a; stroke-width: 1.2; }
  svg .bsg { fill: #e7eefa; stroke: #2f5fa7; stroke-width: 1.4; }
  svg .bdp { fill: #fcf0e6; stroke: #b85a22; stroke-width: 1.4; }
  svg .bw  { fill: #ffffff; stroke: #5f6b7a; stroke-width: 1.2; }
  svg .bext { fill: #ffffff; stroke: #9aa3ae; stroke-width: 1.1; stroke-dasharray: 5 3; }
  svg .grp { fill: none; stroke: #9aa3ae; stroke-width: 1.1; stroke-dasharray: 6 4; }
  svg .grpsg { fill: #f6f9fe; stroke: #2f5fa7; stroke-width: 1.1; stroke-dasharray: 6 4; }
  svg .grpdp { fill: #fffaf5; stroke: #b85a22; stroke-width: 1.1; stroke-dasharray: 6 4; }
  svg .top { fill: #fbfbfc; stroke: #1f2a37; stroke-width: 1.8; }
  svg .num { fill: #1f2a37; } svg .numt { fill: #fff; font-size: 10px; font-weight: 700; }
svg { background: #ffffff; }
</style>
<defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#3f4a56"/></marker>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#2f5fa7"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#b85a22"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#b42318"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#8a94a3"/></marker>
  </defs>
  <text x="20" y="18" class="s mu">SG_ADDRESS = 0x1100 (CPU가 씀)</text>
  <path class="ln" d="M 30 24 L 30 52" marker-end="url(#a)"/>
  <!-- descriptors -->
  <rect class="bsg" x="20" y="54" width="180" height="88" rx="4"/>
  <text x="30" y="72" class="md tt">D0 @0x1100 · id 0xB0</text>
  <text x="30" y="90" class="s m">src  0x11000 · 128 B</text>
  <text x="30" y="105" class="s m">dst  0x21000</text>
  <text x="30" y="120" class="s m">next 0x1140</text>
  <text x="30" y="135" class="s m mu">flags 00</text>
  <rect class="bsg" x="250" y="54" width="180" height="88" rx="4"/>
  <text x="260" y="72" class="md tt">D1 @0x1140 · id 0xB1</text>
  <text x="260" y="90" class="s m">src  0x13000 · 256 B</text>
  <text x="260" y="105" class="s m">dst  0x21080</text>
  <text x="260" y="120" class="s m">next 0x1180</text>
  <text x="260" y="135" class="s m mu">flags 00</text>
  <rect class="bsg" x="480" y="54" width="180" height="88" rx="4" style="stroke-width:2.2"/>
  <text x="490" y="72" class="md tt">D2 @0x1180 · id 0xB2</text>
  <text x="490" y="90" class="s m">src  0x15000 · 64 B</text>
  <text x="490" y="105" class="s m">dst  0x21180</text>
  <text x="490" y="120" class="s m mu">next (무시)</text>
  <text x="490" y="135" class="s m tt">flags 11 = LAST + EOT_IRQ</text>
  <path class="lns" d="M 200 98 L 248 98" marker-end="url(#as)"/><text x="210" y="92" class="xs sgc">next</text>
  <path class="lns" d="M 430 98 L 478 98" marker-end="url(#as)"/><text x="440" y="92" class="xs sgc">next</text>
  <!-- source memory -->
  <rect class="bext" x="20" y="180" width="640" height="34"/>
  <text x="560" y="202" class="s mu">source memory (흩어짐)</text>
  <rect class="bdp" x="70" y="184" width="60" height="26"/><text x="94" y="202" class="md tt">A</text>
  <rect class="bdp" x="270" y="184" width="120" height="26"/><text x="324" y="202" class="md tt">B</text>
  <rect class="bdp" x="490" y="184" width="30" height="26"/><text x="500" y="202" class="md tt">C</text>
  <text x="70" y="226" class="xs m mu">0x11000</text><text x="270" y="226" class="xs m mu">0x13000</text><text x="482" y="226" class="xs m mu">0x15000</text>
  <path class="lnd" d="M 110 142 L 100 182" marker-end="url(#ag)"/>
  <path class="lnd" d="M 340 142 L 330 182" marker-end="url(#ag)"/>
  <path class="lnd" d="M 560 142 L 506 182" marker-end="url(#ag)"/>
  <!-- dest memory -->
  <rect class="bext" x="20" y="250" width="640" height="34"/>
  <text x="440" y="272" class="s mu">destination memory (0x21000부터 이어 붙임)</text>
  <rect class="bdp" x="200" y="254" width="60" height="26"/><text x="224" y="272" class="md tt">A</text>
  <rect class="bdp" x="260" y="254" width="120" height="26"/><text x="314" y="272" class="md tt">B</text>
  <rect class="bdp" x="380" y="254" width="30" height="26"/><text x="390" y="272" class="md tt">C</text>
  <path class="lno" d="M 100 210 L 228 252" marker-end="url(#ao)"/>
  <path class="lno" d="M 330 210 L 320 252" marker-end="url(#ao)"/>
  <path class="lno" d="M 505 210 L 396 252" marker-end="url(#ao)"/>
</svg>