<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300">
<style>
  svg text { font-family: "Malgun Gothic", sans-serif; fill: #1f2a37; }
  svg .m { font-family: Consolas, monospace; }
  svg .tt { font-weight: 700; }
  svg .s { font-size: 10px; } svg .xs { font-size: 9px; } svg .md { font-size: 11px; } svg .lg { font-size: 12.5px; }
  svg .mu { fill: #5b6573; }
  svg .sgc { fill: #2f5fa7; } svg .dpc { fill: #b85a22; } svg .red { fill: #b42318; }
  svg .ln { stroke: #3f4a56; stroke-width: 1.3; fill: none; }
  svg .lnd { stroke: #8a94a3; stroke-width: 1.1; fill: none; stroke-dasharray: 4 3; }
  svg .lns { stroke: #2f5fa7; stroke-width: 1.5; fill: none; }
  svg .lno { stroke: #b85a22; stroke-width: 1.5; fill: none; }
  svg .lnr { stroke: #b42318; stroke-width: 1.5; fill: none; }
  svg .bct { fill: #f3f4f6; stroke: #5f6b7a; stroke-width: 1.2; }
  svg .bsg { fill: #e7eefa; stroke: #2f5fa7; stroke-width: 1.4; }
  svg .bdp { fill: #fcf0e6; stroke: #b85a22; stroke-width: 1.4; }
  svg .bw  { fill: #ffffff; stroke: #5f6b7a; stroke-width: 1.2; }
  svg .bext { fill: #ffffff; stroke: #9aa3ae; stroke-width: 1.1; stroke-dasharray: 5 3; }
  svg .grp { fill: none; stroke: #9aa3ae; stroke-width: 1.1; stroke-dasharray: 6 4; }
  svg .grpsg { fill: #f6f9fe; stroke: #2f5fa7; stroke-width: 1.1; stroke-dasharray: 6 4; }
  svg .grpdp { fill: #fffaf5; stroke: #b85a22; stroke-width: 1.1; stroke-dasharray: 6 4; }
  svg .top { fill: #fbfbfc; stroke: #1f2a37; stroke-width: 1.8; }
  svg .num { fill: #1f2a37; } svg .numt { fill: #fff; font-size: 10px; font-weight: 700; }
svg { background: #ffffff; }
</style>
<defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#3f4a56"/></marker>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#2f5fa7"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#b85a22"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#b42318"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#8a94a3"/></marker>
  </defs>
  <rect class="grpdp" x="20" y="40" width="640" height="236" rx="5"/>
  <text x="30" y="270" class="xs dpc m">i_transfer.i_request_arb (request_arb.v)</text>
  <!-- top inputs -->
  <text x="40" y="20" class="xs m">dma_req_* (MUX에서)</text>
  <path class="ln" d="M 80 26 L 80 66" marker-end="url(#a)"/>
  <text x="208" y="20" class="xs m dpc">m_src_axi</text>
  <path class="lno" d="M 230 82 L 230 26" marker-end="url(#ao)"/><text x="212" y="62" class="xs dpc">AR</text>
  <path class="lno" d="M 252 26 L 252 82" marker-end="url(#ao)"/><text x="258" y="60" class="xs dpc">R</text>
  <text x="530" y="20" class="xs m dpc">m_dest_axi</text>
  <path class="lno" d="M 560 82 L 560 26" marker-end="url(#ao)"/><text x="524" y="62" class="xs dpc">AW, W</text>
  <path class="lno" d="M 600 26 L 600 82" marker-end="url(#ao)"/><text x="606" y="60" class="xs dpc">B</text>
  <!-- blocks -->
  <rect class="bdp" x="36" y="68" width="110" height="46" rx="3"/>
  <text x="44" y="86" class="xs tt m">i_req_gen</text><text x="44" y="101" class="xs mu">burst 수 · burst ID</text>
  <rect class="bdp" x="184" y="84" width="110" height="46" rx="3"/>
  <text x="192" y="102" class="xs tt m">i_src_dma_mm</text><text x="192" y="117" class="xs mu">burst마다 AR 1개</text>
  <rect class="bdp" x="330" y="84" width="140" height="46" rx="3"/>
  <text x="338" y="102" class="xs tt m">burst_memory</text><text x="338" y="117" class="xs mu">8칸 × 128 B</text>
  <rect class="bdp" x="510" y="84" width="130" height="46" rx="3"/>
  <text x="518" y="102" class="xs tt m">i_dest_dma_mm</text><text x="518" y="117" class="xs mu">AW · W · B</text>
  <rect class="bdp" x="490" y="186" width="160" height="46" rx="3"/>
  <text x="498" y="204" class="xs tt m">i_response_manager</text><text x="498" y="219" class="xs mu">마지막 burst의 B → eot</text>
  <!-- flows -->
  <path class="ln" d="M 146 91 L 182 100" marker-end="url(#a)"/><text x="148" y="82" class="xs mu">request_id</text>
  <path class="lno" d="M 294 107 L 328 107" marker-end="url(#ao)"/><text x="296" y="100" class="xs dpc">data</text>
  <path class="lno" d="M 470 107 L 508 107" marker-end="url(#ao)"/><text x="462" y="78" class="xs dpc">완성 burst</text>
  <path class="ln" d="M 80 114 L 80 170 L 575 170 L 575 132" marker-end="url(#a)"/>
  <text x="96" y="184" class="xs mu">DEST 주소 · 마지막 burst 길이 (SRC가 받아들인 뒤 전달)</text>
  <path class="lno" d="M 620 130 L 620 184" marker-end="url(#ao)"/><text x="626" y="160" class="xs dpc">B</text>
  <path class="lnd" d="M 400 130 L 400 146 L 240 146 L 240 132" marker-end="url(#ag)"/>
  <text x="248" y="142" class="xs mu">빈 칸 수 (throttle)</text>
  <path class="lnr" d="M 490 209 L 40 209 L 40 290" marker-end="url(#ar)"/>
  <text x="200" y="203" class="xs red m">eot (= dma_eot) · burst 길이</text>
</svg>