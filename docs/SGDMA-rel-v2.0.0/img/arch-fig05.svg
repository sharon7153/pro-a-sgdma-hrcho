<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 330">
<style>
  svg text { font-family: "Malgun Gothic", sans-serif; fill: #1f2a37; }
  svg .m { font-family: Consolas, monospace; }
  svg .tt { font-weight: 700; }
  svg .s { font-size: 10px; } svg .xs { font-size: 9px; } svg .md { font-size: 11px; } svg .lg { font-size: 12.5px; }
  svg .mu { fill: #5b6573; }
  svg .sgc { fill: #2f5fa7; } svg .dpc { fill: #b85a22; } svg .red { fill: #b42318; }
  svg .ln { stroke: #3f4a56; stroke-width: 1.3; fill: none; }
  svg .lnd { stroke: #8a94a3; stroke-width: 1.1; fill: none; stroke-dasharray: 4 3; }
  svg .lns { stroke: #2f5fa7; stroke-width: 1.5; fill: none; }
  svg .lno { stroke: #b85a22; stroke-width: 1.5; fill: none; }
  svg .lnr { stroke: #b42318; stroke-width: 1.5; fill: none; }
  svg .bct { fill: #f3f4f6; stroke: #5f6b7a; stroke-width: 1.2; }
  svg .bsg { fill: #e7eefa; stroke: #2f5fa7; stroke-width: 1.4; }
  svg .bdp { fill: #fcf0e6; stroke: #b85a22; stroke-width: 1.4; }
  svg .bw  { fill: #ffffff; stroke: #5f6b7a; stroke-width: 1.2; }
  svg .bext { fill: #ffffff; stroke: #9aa3ae; stroke-width: 1.1; stroke-dasharray: 5 3; }
  svg .grp { fill: none; stroke: #9aa3ae; stroke-width: 1.1; stroke-dasharray: 6 4; }
  svg .grpsg { fill: #f6f9fe; stroke: #2f5fa7; stroke-width: 1.1; stroke-dasharray: 6 4; }
  svg .grpdp { fill: #fffaf5; stroke: #b85a22; stroke-width: 1.1; stroke-dasharray: 6 4; }
  svg .top { fill: #fbfbfc; stroke: #1f2a37; stroke-width: 1.8; }
  svg .num { fill: #1f2a37; } svg .numt { fill: #fff; font-size: 10px; font-weight: 700; }
svg { background: #ffffff; }
</style>
<defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#3f4a56"/></marker>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#2f5fa7"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#b85a22"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#b42318"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#8a94a3"/></marker>
  </defs>
  <rect class="grpsg" x="140" y="10" width="400" height="310" rx="5"/>
  <text x="300" y="312" class="xs sgc m">i_transfer.i_dmac_sg (dmac_sg.v)</text>
  <!-- left signals -->
  <text x="4" y="44" class="xs m">req_in_valid</text><text x="4" y="56" class="xs mu">SG_ADDRESS, SUBMIT</text>
  <path class="lns" d="M 98 50 L 158 50" marker-end="url(#as)"/>
  <text x="4" y="216" class="xs m">req_out_*</text><text x="4" y="228" class="xs mu">→ Request MUX</text>
  <path class="lns" d="M 160 222 L 98 222" marker-end="url(#as)"/>
  <text x="4" y="266" class="xs m red">dma_eot (pop)</text>
  <path class="lnr" d="M 98 262 L 158 262" marker-end="url(#ar)"/>
  <text x="4" y="290" class="xs m">resp_out_id / eot</text><text x="4" y="302" class="xs mu">→ DESCRIPTOR_ID, eot gate</text>
  <path class="lns" d="M 160 284 L 116 284" marker-end="url(#as)"/>
  <!-- addr fifo -->
  <rect class="bsg" x="160" y="30" width="120" height="40" rx="3"/>
  <text x="168" y="47" class="xs tt m">i_sg_addr_fifo</text><text x="168" y="62" class="xs mu">첫 주소 · 1단</text>
  <path class="lns" d="M 280 50 L 318 50" marker-end="url(#as)"/><text x="284" y="44" class="xs mu">addr</text>
  <!-- fsm -->
  <rect class="bsg" x="320" y="24" width="200" height="132" rx="3" style="stroke-width:2"/>
  <text x="330" y="42" class="s tt">Descriptor FSM</text>
  <text x="330" y="58" class="xs m">hwdesc_state[1:0]</text>
  <text x="330" y="72" class="xs m mu">IDLE · SEND · RECV · READY</text>
  <path d="M 326 82 L 514 82" stroke="#9db5dc"/>
  <text x="330" y="98" class="s tt">Field registers</text>
  <text x="330" y="113" class="xs m">hwdesc_counter 0..5</text>
  <text x="330" y="127" class="xs m">dest_addr, src_addr, x_length</text>
  <text x="330" y="141" class="xs m">next_desc_addr, hwdesc_id, flags</text>
  <!-- right port -->
  <rect class="bext" x="590" y="30" width="84" height="120" rx="3"/>
  <text x="598" y="80" class="s tt">u_sg_mem</text><text x="598" y="96" class="xs mu">descriptors</text>
  <path class="lns" d="M 520 54 L 588 54" marker-end="url(#as)"/><text x="526" y="48" class="xs m sgc">AR, ARLEN=5</text>
  <path class="lns" d="M 588 120 L 522 120" marker-end="url(#as)"/><text x="526" y="114" class="xs m sgc">R × 6 beat</text>
  <text x="548" y="168" class="xs m mu">m_sg_axi</text>
  <!-- splitter -->
  <rect class="bsg" x="330" y="182" width="180" height="34" rx="3"/>
  <text x="340" y="197" class="xs tt m">i_req_splitter</text><text x="340" y="210" class="xs mu">두 출력이 모두 받아야 ready</text>
  <path class="lns" d="M 420 156 L 420 180" marker-end="url(#as)"/><text x="426" y="172" class="xs mu">fetch_valid (DESC_READY)</text>
  <!-- desc fifo -->
  <rect class="bsg" x="160" y="202" width="130" height="40" rx="3"/>
  <text x="168" y="219" class="xs tt m">i_sg_desc_fifo</text><text x="168" y="234" class="xs mu">dest · src · x_length · 1단</text>
  <path class="lns" d="M 330 210 L 292 210" marker-end="url(#as)"/>
  <!-- id fifo -->
  <rect class="bsg" x="160" y="254" width="130" height="40" rx="3"/>
  <text x="168" y="271" class="xs tt m">i_fifo (ID FIFO)</text><text x="168" y="286" class="xs mu">{eot, id} 33bit · 최대 4개</text>
  <path class="lns" d="M 420 216 L 420 274 L 292 274" marker-end="url(#as)"/>
</svg>