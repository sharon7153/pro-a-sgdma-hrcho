<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 560">
<style>
  svg text { font-family: "Malgun Gothic", sans-serif; fill: #1f2a37; }
  svg .m { font-family: Consolas, monospace; }
  svg .tt { font-weight: 700; }
  svg .s { font-size: 10px; } svg .xs { font-size: 9px; } svg .md { font-size: 11px; } svg .lg { font-size: 12.5px; }
  svg .mu { fill: #5b6573; }
  svg .sgc { fill: #2f5fa7; } svg .dpc { fill: #b85a22; } svg .red { fill: #b42318; }
  svg .ln { stroke: #3f4a56; stroke-width: 1.3; fill: none; }
  svg .lnd { stroke: #8a94a3; stroke-width: 1.1; fill: none; stroke-dasharray: 4 3; }
  svg .lns { stroke: #2f5fa7; stroke-width: 1.5; fill: none; }
  svg .lno { stroke: #b85a22; stroke-width: 1.5; fill: none; }
  svg .lnr { stroke: #b42318; stroke-width: 1.5; fill: none; }
  svg .bct { fill: #f3f4f6; stroke: #5f6b7a; stroke-width: 1.2; }
  svg .bsg { fill: #e7eefa; stroke: #2f5fa7; stroke-width: 1.4; }
  svg .bdp { fill: #fcf0e6; stroke: #b85a22; stroke-width: 1.4; }
  svg .bw  { fill: #ffffff; stroke: #5f6b7a; stroke-width: 1.2; }
  svg .bext { fill: #ffffff; stroke: #9aa3ae; stroke-width: 1.1; stroke-dasharray: 5 3; }
  svg .grp { fill: none; stroke: #9aa3ae; stroke-width: 1.1; stroke-dasharray: 6 4; }
  svg .grpsg { fill: #f6f9fe; stroke: #2f5fa7; stroke-width: 1.1; stroke-dasharray: 6 4; }
  svg .grpdp { fill: #fffaf5; stroke: #b85a22; stroke-width: 1.1; stroke-dasharray: 6 4; }
  svg .top { fill: #fbfbfc; stroke: #1f2a37; stroke-width: 1.8; }
  svg .num { fill: #1f2a37; } svg .numt { fill: #fff; font-size: 10px; font-weight: 700; }
svg { background: #ffffff; }
</style>
<defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#3f4a56"/></marker>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#2f5fa7"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#b85a22"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#b42318"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#8a94a3"/></marker>
  </defs>
  <rect class="grp" x="8" y="8" width="330" height="452" rx="6"/><text x="18" y="26" class="s tt">SW와 SG engine (dmac_sg)</text>
  <rect class="grp" x="352" y="8" width="320" height="544" rx="6"/><text x="362" y="26" class="s tt">Data engine (request_arb) — descriptor 1개마다</text>
  <!-- left lane -->
  <rect class="bw" x="48" y="40" width="250" height="34" rx="17"/><text x="104" y="62" class="s">Start: SW가 descriptor 작성</text>
  <path class="ln" d="M 173 74 L 173 88" marker-end="url(#a)"/>
  <rect class="bct" x="48" y="90" width="250" height="34" rx="3"/><text x="70" y="112" class="s">SW: IRQ_MASK = 0x1, CONTROL = 0x5</text>
  <path class="ln" d="M 173 124 L 173 138" marker-end="url(#a)"/>
  <rect class="bct" x="48" y="140" width="250" height="34" rx="3"/><text x="64" y="162" class="s">SW: SG_ADDRESS = D0, SUBMIT = 1 (SOT)</text>
  <path class="ln" d="M 173 174 L 173 188" marker-end="url(#a)"/>
  <rect class="bsg" x="48" y="190" width="250" height="34" rx="3"/><text x="72" y="212" class="s">descriptor fetch: AR + R × 6 beat</text>
  <path class="ln" d="M 173 224 L 173 238" marker-end="url(#a)"/>
  <rect class="bsg" x="48" y="240" width="250" height="40" rx="3"/><text x="62" y="257" class="s">필드 → descriptor FIFO (엔진으로)</text><text x="62" y="272" class="s">id + EOT_IRQ → ID FIFO</text>
  <path class="ln" d="M 173 280 L 173 298" marker-end="url(#a)"/>
  <path class="bw" d="M 173 300 L 243 330 L 173 360 L 103 330 z"/><text x="153" y="334" class="s tt">LAST?</text>
  <path class="ln" d="M 103 330 L 28 330 L 28 207 L 46 207" marker-end="url(#a)"/><text x="34" y="324" class="xs">no</text>
  <text x="18" y="436" class="xs mu">no 경로 = 데이터가 옮겨지는 동안 다음 AR (prefetch)</text>
  <path class="ln" d="M 173 360 L 173 378" marker-end="url(#a)"/><text x="180" y="374" class="xs">yes</text>
  <rect class="bw" x="78" y="380" width="190" height="34" rx="17"/><text x="104" y="402" class="s">SG engine → IDLE</text>
  <!-- request link -->
  <path class="lns" d="M 298 255 L 330 255 L 330 62 L 380 62" marker-end="url(#as)"/><text x="306" y="248" class="xs sgc">요청</text>
  <!-- right lane -->
  <rect class="bdp" x="382" y="45" width="270" height="34" rx="3"/><text x="398" y="67" class="s">SRC burst를 읽어 버퍼에 넣음</text>
  <path class="ln" d="M 517 79 L 517 98" marker-end="url(#a)"/>
  <rect class="bdp" x="382" y="100" width="270" height="34" rx="3"/><text x="398" y="122" class="s">완성된 burst를 DEST에 쓰고 B 대기</text>
  <path class="ln" d="M 517 134 L 517 153" marker-end="url(#a)"/>
  <path class="bw" d="M 517 155 L 600 182 L 517 209 L 434 182 z"/><text x="474" y="186" class="xs tt">마지막 burst?</text>
  <path class="ln" d="M 600 182 L 662 182 L 662 62 L 654 62" marker-end="url(#a)"/><text x="606" y="176" class="xs">no</text>
  <path class="ln" d="M 517 209 L 517 228" marker-end="url(#a)"/><text x="524" y="222" class="xs">yes</text>
  <rect class="bct" x="382" y="230" width="270" height="34" rx="3"/><text x="398" y="252" class="s">마지막 B → dma_eot, ID FIFO pop</text>
  <path class="ln" d="M 517 264 L 517 283" marker-end="url(#a)"/>
  <path class="bw" d="M 517 285 L 600 312 L 517 339 L 434 312 z"/><text x="476" y="316" class="xs tt">EOT_IRQ = 1?</text>
  <path class="ln" d="M 434 312 L 372 312 L 372 470 L 380 470" marker-end="url(#a)"/><text x="400" y="306" class="xs">no</text>
  <path class="ln" d="M 517 339 L 517 358" marker-end="url(#a)"/><text x="524" y="352" class="xs">yes</text>
  <rect class="bct" x="382" y="360" width="270" height="40" rx="3"/><text x="398" y="377" class="s">TRANSFER_DONE[id] = 1</text><text x="398" y="392" class="s">IRQ_SOURCE[1] = 1 → irq = 1</text>
  <path class="ln" d="M 517 400 L 517 418" marker-end="url(#a)"/>
  <rect class="bw" x="382" y="420" width="270" height="36" rx="18"/><text x="398" y="437" class="s">End: SW가 IRQ 지움 (W1C)</text><text x="398" y="451" class="xs mu">DESCRIPTOR_ID 확인</text>
  <rect class="bw" x="382" y="462" width="270" height="34" rx="17"/><text x="398" y="484" class="s">다음 descriptor 요청을 기다림</text>
  <text x="362" y="530" class="xs mu">EOT_IRQ = 0인 descriptor는 끝나도 레지스터 쪽에 아무 변화가 없습니다.</text>
</svg>