<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 268">
<style>
  svg text { font-family: "Malgun Gothic", sans-serif; fill: #1f2a37; }
  svg .m { font-family: Consolas, monospace; }
  svg .tt { font-weight: 700; }
  svg .s { font-size: 10px; } svg .xs { font-size: 9px; } svg .md { font-size: 11px; } svg .lg { font-size: 12.5px; }
  svg .mu { fill: #5b6573; }
  svg .sgc { fill: #2f5fa7; } svg .dpc { fill: #b85a22; } svg .red { fill: #b42318; }
  svg .ln { stroke: #3f4a56; stroke-width: 1.3; fill: none; }
  svg .lnd { stroke: #8a94a3; stroke-width: 1.1; fill: none; stroke-dasharray: 4 3; }
  svg .lns { stroke: #2f5fa7; stroke-width: 1.5; fill: none; }
  svg .lno { stroke: #b85a22; stroke-width: 1.5; fill: none; }
  svg .lnr { stroke: #b42318; stroke-width: 1.5; fill: none; }
  svg .bct { fill: #f3f4f6; stroke: #5f6b7a; stroke-width: 1.2; }
  svg .bsg { fill: #e7eefa; stroke: #2f5fa7; stroke-width: 1.4; }
  svg .bdp { fill: #fcf0e6; stroke: #b85a22; stroke-width: 1.4; }
  svg .bw  { fill: #ffffff; stroke: #5f6b7a; stroke-width: 1.2; }
  svg .bext { fill: #ffffff; stroke: #9aa3ae; stroke-width: 1.1; stroke-dasharray: 5 3; }
  svg .grp { fill: none; stroke: #9aa3ae; stroke-width: 1.1; stroke-dasharray: 6 4; }
  svg .grpsg { fill: #f6f9fe; stroke: #2f5fa7; stroke-width: 1.1; stroke-dasharray: 6 4; }
  svg .grpdp { fill: #fffaf5; stroke: #b85a22; stroke-width: 1.1; stroke-dasharray: 6 4; }
  svg .top { fill: #fbfbfc; stroke: #1f2a37; stroke-width: 1.8; }
  svg .num { fill: #1f2a37; } svg .numt { fill: #fff; font-size: 10px; font-weight: 700; }
svg { background: #ffffff; }
</style>
<defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#3f4a56"/></marker>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#2f5fa7"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#b85a22"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#b42318"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L10,5 L0,9 z" fill="#8a94a3"/></marker>
  </defs>
  <text x="230" y="11" class="xs m">needs_reset (ENABLE이 0이었음)</text>
  <g transform="translate(0,18)">
  <text x="6" y="42" class="xs m">resetn = 0</text><path class="ln" d="M 62 38 L 78 38" marker-end="url(#a)"/>
  <ellipse cx="128" cy="38" rx="48" ry="22" class="bw"/><text x="94" y="36" class="xs tt">DO_RESET (0)</text><text x="94" y="49" class="xs mu">리셋 펄스 시작</text>
  <ellipse cx="290" cy="38" rx="58" ry="22" class="bw"/><text x="250" y="36" class="xs tt">RESET (1)</text><text x="250" y="49" class="xs mu">리셋 끝 · ENABLE 대기</text>
  <ellipse cx="470" cy="38" rx="58" ry="22" class="bw"/><text x="432" y="36" class="xs tt">DISABLED (2)</text><text x="432" y="49" class="xs mu">PAUSE 해제 대기</text>
  <ellipse cx="470" cy="150" rx="58" ry="22" class="bw"/><text x="432" y="148" class="xs tt">STARTUP (3)</text><text x="432" y="161" class="xs mu">모든 블록 켜짐 대기</text>
  <ellipse cx="250" cy="150" rx="58" ry="22" class="bsg"/><text x="212" y="148" class="xs tt">ENABLED (4)</text><text x="212" y="161" class="xs mu">정상 동작</text>
  <ellipse cx="250" cy="226" rx="70" ry="20" class="bw"/><text x="206" y="224" class="xs tt">SHUTDOWN (5)</text><text x="206" y="236" class="xs mu">진행 중 AXI 마무리 대기</text>
  <path class="ln" d="M 176 38 L 230 38" marker-end="url(#a)"/><text x="182" y="30" class="xs mu">항상</text>
  <path class="ln" d="M 348 38 L 410 38" marker-end="url(#a)"/><text x="350" y="30" class="xs m">ENABLE=1</text>
  <path class="ln" d="M 470 60 L 470 126" marker-end="url(#a)"/><text x="476" y="96" class="xs m">PAUSE=0 (needs_reset=0)</text>
  <path class="ln" d="M 412 150 L 310 150" marker-end="url(#a)"/><text x="330" y="142" class="xs m">all enabled</text>
  <path class="ln" d="M 230 172 L 230 204" marker-end="url(#a)"/><text x="100" y="192" class="xs m">ENABLE=0 또는 PAUSE=1</text>
  <path class="ln" d="M 320 226 L 600 226 L 600 38 L 530 38" marker-end="url(#a)"/><text x="440" y="220" class="xs m">all disabled (버스 조용해짐)</text>
  <path class="ln" d="M 440 18 Q 300 -2 140 16" marker-end="url(#a)"/>
  </g>
</svg>